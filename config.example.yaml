# Deputy deploys what moving tags in an OCI registry point to (watch below, bootstrap). It takes no deploy
# requests: the cosign signatures are the trust anchor. listen_addr serves POST /check and GET /status.
listen_addr: 0.0.0.0:8082
deployment_timeout_seconds: 900

# Registry login for the release archives (code and stack), e.g. ghcr.io.
# Empty username: anonymous pulls (public packages). The password comes from the environment variable
# password_env (/etc/magenx-deputy-go/env), for ghcr.io a classic PAT with read:packages only.
oci:
  username: ""
  password_env: REGISTRY_PASSWORD

deploy:
  root_dir: /home
  releases_dir_name: releases
  current_link_suffix: public/current
  default_brand: mystore
  default_domain: shop.example.com
  minimum_disk_space_gb: 10
  # <oci_repository>:<tag>, an image whose only layer is the release archive (crane append), annotated
  # org.opencontainers.image.version=<tag> and signed with cosign; the release dir is the tag.
  oci_repository: ghcr.io/acme/magento-release
  # Verifies the release manifest signature before the download. Required.
  cosign_public_key: /etc/magenx-deputy-go/cosign.pub
  leader_env_var: IS_LEADER
  leader_default: true
  # Leader only. {release_dir} = shell-quoted path of the release the command runs for (also $RELEASE_DIR).
  # Before switch, in the new release; old release keeps serving.
  # setup:upgrade here needs deployment.blue_green.enabled in env.php and env.php in the release (shared link).
  pre_switch_commands:
    - cd {release_dir} && bin/magento setup:db:status >/dev/null 2>&1 || bin/magento setup:upgrade --keep-generated
  # After switch, in the new release.
  leader_commands:
    - cd {release_dir} && cacheflush
  # After a failed post-switch step switched back, in the previous release.
  rollback_commands:
    - cd {release_dir} && cacheflush
  rollback_timeout_seconds: 300
  # Release dirs kept after a successful deploy (new and previous are always kept); -1 disables pruning.
  keep_releases: 5
  # User that owns the releases and runs the commands: "user", "user:group", "uid" or "uid:gid".
  # Empty = the deputy process user. Deputy must run as root to use another user.
  # Docker host with userns-remap: the host uid of the container user, e.g. "165532:165532".
  run_as: mystore
  # The commands only (pre_switch, leader, rollback) as another user, run_as still owns the release files.
  # Empty = run_as. Docker host: "root" with allow_root_commands, for "docker compose run ... bin/magento".
  commands_run_as: ""
  # Commands get a clean environment (HOME, USER, LOGNAME, PATH) plus these:
  # KEY=VALUE, or NAME to pass deputy's own value of NAME. The registry password is never passed.
  command_env: []
  # Commands as root (commands_run_as or run_as root, or neither while deputy runs as root) are refused unless true.
  allow_root_commands: false

health_check:
  enabled: true
  scheme: https
  path_template: /health_check.php?release=%s
  expected_status: 200
  timeout_seconds: 20
  user_agent_prefix: Deployment health check
  attempts: 3
  retry_interval_seconds: 5

shared_links:
  - source: /var/export
    target: var/export
  - source: /var/report
    target: var/report
  - source: /var/import
    target: var/import
  - source: /var/import_history
    target: var/import_history
  - source: /var/importexport
    target: var/importexport
  - source: /pub/media
    target: pub/media
#  - source: /home/mystore/shared/app/etc/env.php
#    target: app/etc/env.php

# Docker stack releases: a bundle of the repository at the release tag plus docker-compose.release.yml, which
# pins every image by digest. The release workflow pushes it as the only layer of <oci_repository>:<tag> and
# signs that manifest with the key below.
stack:
  enabled: false
  oci_repository: ghcr.io/acme/shop-stack
  # releases/<tag> and the current symlink
  dir: /opt/mystore/stack
  project_name: mystore
  compose_files: [docker-compose.yml]
  lock_file: docker-compose.release.yml
  # relative to the release; server-only files come in through shared_links
  env_files: [.env, .env.secrets]
  # .env.secrets stays where docker.sh created it, next to the clone the server scripts run from
  shared_links:
    - source: /opt/mystore/docker/.env.secrets
      target: .env.secrets
  # Trust anchor for the bundle and every image, never taken from the bundle.
  # Copy cosign/cosign.pub of the docker repository here.
  cosign_public_key: /etc/magenx-deputy-go/cosign.pub
  cosign_args: ["--insecure-ignore-tlog=true"]
  require_sbom: false
  # "docker login <registry>" before pulling, password from the environment variable registry_password_env
  # (/etc/magenx-deputy-go/env, e.g. a classic PAT with read:packages only).
  # Empty registry_username: the run_as user is already logged in.
  registry: ghcr.io
  registry_username: ""
  registry_password_env: REGISTRY_PASSWORD
  # empty = every service minus exclude_services, services of profiles not listed in profiles are skipped
  services: []
  exclude_services: [magento]
  profiles: []
  remove_orphans: false
  # The watch does not deploy an image change of these services: their data cannot be rolled back by
  # switching images. After a backup: magenx-deputy-go bootstrap -skip-code -stack-tag <tag> -confirm <service>
  confirm_services: [mariadb, opensearch]
  # /bin/sh in a release dir, {release_dir} and $RELEASE_DIR as in deploy commands
  pre_up_commands: []
  post_up_commands: []
  rollback_commands: []
  # In the previous release when a deploy fails after pre_up_commands started: before its "up" on a
  # rollback, and after a failure before the switch. Undo here what pre_up_commands changed outside the
  # release, e.g. SOPS secrets of the docker repository decrypted to tmpfs:
  #   pre_up_commands: ["bash scripts/secrets.sh decrypt"]
  #   restore_commands: ["bash scripts/secrets.sh decrypt"]
  #   command_env: ["SOPS_AGE_KEY_FILE=/root/.config/sops/age/keys.txt", "STACK_ENV=production"]
  restore_commands: []
  # checked after "up" with health_check attempts, timeout and expected_status
  health_check_url: ""
  wait_timeout_seconds: 600
  deployment_timeout_seconds: 1800
  rollback_timeout_seconds: 900
  minimum_disk_space_gb: 5
  keep_releases: 3
  # Runs docker, cosign, tar and the commands. Needs the docker socket: root or a member of group docker.
  run_as: ""
  command_env: []

# What the service deploys: the releases the moving tags point to. See README, Watch.
watch:
  interval_seconds: 300
  stack_tag: production
  code_tag: production
  # servers that are not the leader wait this long before they deploy a new Magento release
  settle_seconds: 0
  # "-" disables an endpoint; without both deputy opens no port
  check_path: /check
  status_path: /status
